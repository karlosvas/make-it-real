[package]
name = "mir-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
getrandom = "0.4"
axum = "0.8"
regex = "1"
reqwest = { version = "0.13", features = ["json", "form"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["fs", "cors"] }
wasmi = "2"
